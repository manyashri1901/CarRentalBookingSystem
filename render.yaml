services:
  - type: web
    name: ecar-ride-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas URI in the Render dashboard
      - key: CLIENT_ORIGIN
        sync: false # your deployed frontend URL, e.g. https://your-app.vercel.app
